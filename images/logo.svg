<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <defs>
    <linearGradient id="badge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff7a1a"/>
      <stop offset="1" stop-color="#e85d00"/>
    </linearGradient>
  </defs>
  <!-- badge -->
  <rect width="48" height="48" rx="12" fill="url(#badge)"/>
  <!-- two ropes twisted together (ori = two, toki = rope) -->
  <g fill="none" stroke="#ffffff" stroke-width="4.3" stroke-linecap="round" stroke-linejoin="round">
    <path d="M24 10 C38 15, 38 19, 24 24 C10 29, 10 33, 24 38"/>
    <path d="M24 10 C10 15, 10 19, 24 24 C38 29, 38 33, 24 38"/>
  </g>
  <!-- rope end knots -->
  <circle cx="24" cy="10" r="3.3" fill="#ffffff"/>
  <circle cx="24" cy="38" r="3.3" fill="#ffffff"/>
</svg>
