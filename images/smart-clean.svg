<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" fill="none">
  <defs>
    <linearGradient id="sc-glass" x1="12" y1="12" x2="84" y2="84" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#f97316"/>
      <stop offset="1" stop-color="#f97316"/>
    </linearGradient>
  </defs>

  <!-- Window glass -->
  <rect x="8" y="8" width="80" height="80" rx="16" fill="url(#sc-glass)"/>

  <!-- Cleaned, streak-free area (upper-left of the squeegee's edge) -->
  <path d="M8 24 Q8 8 24 8 H70 L30 64 Q18 76 8 64 Z" fill="#fff7ed"/>

  <!-- Window frame cross (mullions) -->
  <g fill="#ffffff">
    <rect x="45" y="8" width="6" height="80"/>
    <rect x="8" y="45" width="80" height="6"/>
  </g>

  <!-- Sparkles in the clean area (orange so they read on the near-white glass) -->
  <g fill="#f97316">
    <path d="M27 25 l2.6 6 6 2.6 -6 2.6 -2.6 6 -2.6 -6 -6 -2.6 6 -2.6 z"/>
    <path d="M41 19 l1.7 3.9 3.9 1.7 -3.9 1.7 -1.7 3.9 -1.7 -3.9 -3.9 -1.7 3.9 -1.7 z"/>
    <path d="M22 46 l1.5 3.5 3.5 1.5 -3.5 1.5 -1.5 3.5 -1.5 -3.5 -3.5 -1.5 3.5 -1.5 z"/>
  </g>

  <!-- Squeegee (dark): rubber blade along the clean/dirty edge + handle to the corner -->
  <g fill="#14142a" stroke="#14142a" stroke-width="1.5" stroke-linejoin="round">
    <!-- blade -->
    <path d="M59.3 14.4 L66.7 19.6 L34.7 63.6 L27.3 58.4 Z"/>
    <!-- handle to lower-right corner -->
    <path d="M48.0 38.9 L82.6 77.7 L77.4 82.3 L42.8 43.5 Z"/>
  </g>
</svg>
