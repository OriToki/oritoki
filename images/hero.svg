<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1b2a47"/>
      <stop offset="0.55" stop-color="#101a2e"/>
      <stop offset="1" stop-color="#0a111f"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.78" cy="0.12" r="0.55">
      <stop offset="0" stop-color="#ff6a00" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#ff6a00" stop-opacity="0"/>
    </radialGradient>
    <pattern id="winA" width="70" height="92" patternUnits="userSpaceOnUse">
      <rect x="12" y="14" width="46" height="60" fill="#1d3257"/>
    </pattern>
  </defs>

  <rect width="1600" height="900" fill="url(#sky)"/>
  <rect width="1600" height="900" fill="url(#glow)"/>

  <!-- distant skyline -->
  <g fill="#0c1626">
    <rect x="0" y="560" width="160" height="340"/>
    <rect x="150" y="500" width="120" height="400"/>
    <rect x="260" y="610" width="180" height="290"/>
    <rect x="430" y="540" width="120" height="360"/>
    <rect x="560" y="640" width="150" height="260"/>
    <rect x="1180" y="585" width="160" height="315"/>
    <rect x="1330" y="520" width="130" height="380"/>
    <rect x="1450" y="610" width="150" height="290"/>
  </g>

  <!-- foreground building -->
  <rect x="980" y="120" width="430" height="780" fill="#12203a"/>
  <rect x="980" y="120" width="430" height="780" fill="url(#winA)"/>
  <!-- a few lit windows -->
  <g fill="#ff8a2a" opacity="0.85">
    <rect x="1052" y="226" width="46" height="60"/>
    <rect x="1192" y="410" width="46" height="60"/>
    <rect x="1122" y="686" width="46" height="60"/>
    <rect x="1332" y="318" width="46" height="60"/>
  </g>

  <!-- rope -->
  <line x1="1190" y1="120" x2="1190" y2="520" stroke="#06090f" stroke-width="4"/>

  <!-- climber -->
  <g transform="translate(1190,520)">
    <rect x="-18" y="4" width="36" height="9" rx="4" fill="#06090f"/>
    <rect x="-11" y="-30" width="22" height="40" rx="10" fill="#ff6a00"/>
    <rect x="-9" y="10" width="7" height="28" rx="3" fill="#13233f"/>
    <rect x="3" y="10" width="7" height="28" rx="3" fill="#13233f"/>
    <circle cx="0" cy="-40" r="11" fill="#f1d8b6"/>
    <path d="M-12 -41 a12 12 0 0 1 24 0 z" fill="#ffd400"/>
  </g>
</svg>
