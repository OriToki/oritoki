<!DOCTYPE html>
<!--
  =====================================================================
   ORITOKI — 404
  ---------------------------------------------------------------------
   Deliberately standalone: no Tailwind, no CDN, no fonts to fetch. A
   404 is the one page that must render even when something is wrong,
   so everything it needs is in this file. Bilingual like the rest of
   the site, but without the JS toggle — both languages are simply
   shown, Georgian first.

   Netlify and Cloudflare Pages serve this automatically. On Apache
   (cPanel) it needs one line in .htaccess:
       ErrorDocument 404 /404.html
  =====================================================================
-->
<html lang="ka">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>გვერდი ვერ მოიძებნა — ორითოკი</title>
  <meta name="robots" content="noindex" />
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh;
      display: flex; align-items: center; justify-content: center;
      background: #121314; color: #ececf2;
      font-family: 'Noto Sans Georgian', 'Helvetica Neue', Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
      padding: 2rem 1.25rem;
    }
    .wrap { text-align: center; max-width: 34rem; }
    .code { font-size: clamp(4.5rem, 18vw, 8rem); font-weight: 800; line-height: 1; color: #f97316; letter-spacing: -.02em; }
    h1 { font-size: clamp(1.15rem, 4.5vw, 1.6rem); font-weight: 700; margin: 1rem 0 .35rem; }
    .en { color: #9e9ea0; font-size: 1rem; margin: 0 0 1.6rem; }
    p.lead { color: #9e9ea0; line-height: 1.65; margin: 0 0 2rem; }
    .btns { display: flex; gap: .7rem; justify-content: center; flex-wrap: wrap; }
    a.btn {
      display: inline-block; padding: .8rem 1.5rem; border-radius: 999px;
      font-weight: 600; font-size: .95rem; text-decoration: none;
      transition: background .18s ease, border-color .18s ease, color .18s ease;
    }
    a.solid { background: #f97316; color: #fff; }
    a.solid:hover { background: #ea6a0c; }
    a.ghost { border: 1px solid #2a2b2c; color: #ececf2; }
    a.ghost:hover { border-color: #f97316; color: #f97316; }
    /* The rope: a nod to the site's climber, drawn in CSS so this page stays self-contained. */
    .rope { width: 2px; height: 84px; margin: 0 auto 1.5rem; background: linear-gradient(#2a2b2c, #616161); border-radius: 1px; position: relative; }
    .rope::after { content: ""; position: absolute; left: 50%; bottom: -5px; width: 10px; height: 10px; transform: translateX(-50%); border-radius: 50%; background: #616161; box-shadow: 0 3px 0 -1px #616161; }
    @media (prefers-color-scheme: light) {
      body { background: #f0f0ec; color: #14142a; }
      .en, p.lead { color: #52525b; }
      a.ghost { border-color: #e5e7eb; color: #14142a; }
      .rope { background: linear-gradient(#e5e7eb, #9ca3af); }
      .rope::after { background: #9ca3af; box-shadow: 0 3px 0 -1px #9ca3af; }
    }
  </style>
</head>
<body>
  <main class="wrap">
    <div class="rope" aria-hidden="true"></div>
    <div class="code">404</div>
    <h1>ეს გვერდი ვერ მოიძებნა</h1>
    <p class="en">This page could not be found</p>
    <p class="lead">
      შესაძლოა ბმული შეიცვალა ან წაიშალა.<br />
      <span style="opacity:.75">The link may have moved or been removed.</span>
    </p>
    <div class="btns">
      <a class="btn solid" href="/">მთავარ გვერდზე &nbsp;·&nbsp; Home</a>
      <a class="btn ghost" href="/#contact">კონტაქტი &nbsp;·&nbsp; Contact</a>
    </div>
  </main>
</body>
</html>
